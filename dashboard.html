<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Freebuff2OpenCode 控制台</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <style>
    :root {
      --primary-color: #0d6efd;
      --secondary-color: #6c757d;
      --success-color: #32CD32;
      --bs-success: #32CD32;
      --bs-success-rgb: 50, 205, 50;
      --danger-color: #dc3545;
    }
    body {
      margin: 0;
      min-height: 100vh;
      padding: 0;
      background-color: #0d1117;
    }
    .dashboard-container {
      position: relative;
      z-index: 10;
      max-width: 1200px;
      margin: 0 auto;
      overflow-x: hidden;
    }
    .card {
      position: relative;
      border: none;
      border-radius: var(--glass-radius, 12px);
      margin-bottom: 20px;
      background: transparent !important;
    }
    .glass-panel {
      position: absolute;
      inset: 0;
      z-index: 0;
      border-radius: inherit;
      overflow: hidden;
    }
    .glass-panel::before {
      content: '';
      position: absolute;
      inset: 0;
      z-index: 1;
      border-radius: inherit;
      background-color: rgba(255, 255, 255, 0.08);
      pointer-events: none;
    }
    .glass-panel::after {
      content: '';
      position: absolute;
      inset: 0;
      z-index: 0;
      border-radius: inherit;
      pointer-events: none;
    }
    .card-content {
      position: relative;
      z-index: 3;
      border-radius: inherit;
      overflow: hidden;
      background: rgba(0, 0, 0, 0.1);
    }
    .card-header {
      background: rgba(0, 0, 0, 0.2) !important;
      border-bottom: 1px solid rgba(255, 255, 255, 0.15);
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      font-size: 14px;
      color: white;
      padding: 0.4rem 1.25rem;
      position: relative;
      z-index: 4;
    }
    .card-body {
      padding: 0.5rem;
      position: relative;
      z-index: 4;
      backdrop-filter: blur(13px) !important;
      -webkit-backdrop-filter: blur(13px) !important;
    }
    .status-indicator {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      display: inline-block;
      margin-right: 8px;
    }
    .status-online { background-color: var(--success-color); box-shadow: 0 0 10px var(--success-color); }
    .status-offline { background-color: var(--danger-color); box-shadow: 0 0 10px var(--danger-color); }
    .status-unknown { background-color: var(--secondary-color); }
    .token-blurred {
      filter: blur(5px);
      transition: filter 0.2s ease;
    }
    .token-blurred:hover {
      filter: blur(0) !important;
    }
    .btn-white-bg {
      background: white;
      border: 1px solid white;
      color: #0d1117;
    }
    .btn-white-bg:hover {
      background: rgba(255, 255, 255, 0.85);
      border-color: white;
      color: #0d1117;
    }
    .btn-outline-action {
      border: 1px solid rgba(255, 255, 255, 0.8);
      color: white;
      background: transparent;
    }
    .btn-outline-action:hover {
      background: rgba(255, 255, 255, 0.15);
      border-color: white;
      color: white;
    }
    .stats-card {
      background: transparent;
      border-radius: 12px;
      padding: 0;
      text-align: center;
      position: relative;
      z-index: 10;
      backdrop-filter: blur(13px);
      -webkit-backdrop-filter: blur(13px);
    }
    .stats-value {
      font-size: 28px;
      font-weight: 700;
      color: white;
    }
    .stats-label {
      font-size: 12px;
      color: rgba(255, 255, 255, 0.8);
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    .toast-container {
      position: fixed;
      top: 20px;
      right: 20px;
      z-index: 1050;
    }
    .form-label {
      font-weight: 600;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: rgba(255, 255, 255, 0.9);
      margin-bottom: 6px;
    }
    .form-control, .form-select {
      display: block;
      width: 100%;
      background: rgba(255, 255, 255, 0.15);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: white;
      padding: 0.375rem 0.75rem;
      font-size: 1rem;
      border-radius: 0.375rem;
    }
    .form-control:focus, .form-select:focus {
      background: rgba(255, 255, 255, 0.2);
      border-color: rgba(255, 255, 255, 0.4);
      color: white;
      outline: 0;
      box-shadow: 0 0 0 0.2rem rgba(102, 126, 234, 0.25);
    }
    .form-control::placeholder {
      color: rgba(255, 255, 255, 0.6);
    }
    .text-muted {
      color: rgba(255, 255, 255, 0.7) !important;
    }
    h4, h5, strong, .fw-medium {
      color: white !important;
    }
    small {
      color: rgba(255, 255, 255, 0.8) !important;
    }
    .collapsible-header {
      cursor: pointer;
      user-select: none;
    }
    .collapsible-header .toggle-icon {
      transition: transform 0.2s ease;
    }
    .collapsible-header .toggle-icon.collapsed {
      transform: rotate(-90deg);
    }
    .collapse-section {
      transition: all 0.3s ease;
    }
    .collapse-section.collapsed {
      display: none;
    }
    .pool-card {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 10px;
    }
    .pool-card.locked {
      border: 1px dashed rgba(0, 0, 0, 0.8);
      background: rgba(0, 0, 0, 0.1);
    }
    .locked-model-badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      margin-top: 8px;
      padding: 4px 10px;
      border: 1px dashed rgba(0, 0, 0, 0.8);
      border-radius: 6px;
      background: rgba(0, 0, 0, 0.15);
      font-size: 0.78rem;
      color: #000000;
      font-weight: 600;
    }
    .locked-model-badge .lock-icon {
      font-size: 0.85rem;
    }
    .unlock-btn {
      margin-left: 8px;
      padding: 2px 10px;
      border: 1px solid rgba(0, 0, 0, 0.8);
      border-radius: 5px;
      background: rgba(0, 0, 0, 0.2);
      color: #000000;
      font-size: 0.72rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .unlock-btn:hover {
      background: rgba(0, 0, 0, 0.35);
    }
    .pool-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }
    .pool-name {
      font-weight: 600;
      color: #58a6ff;
      font-size: 0.95rem;
    }
    .pool-status {
      padding: 3px 10px;
      border-radius: 10px;
      font-size: 0.75rem;
      font-weight: 600;
    }
    .quota-block {
      margin-top: 10px;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      padding-top: 8px;
    }
    .quota-title {
      font-size: 0.72rem;
      font-weight: 600;
      color: rgba(255, 255, 255, 0.55);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 6px;
    }
    .quota-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 5px;
      font-size: 0.78rem;
    }
    .quota-row .q-model {
      flex: 0 0 150px;
      color: #e6edf3;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .quota-row .q-bar {
      flex: 1 1 auto;
      height: 6px;
      border-radius: 3px;
      background: rgba(255, 255, 255, 0.08);
      overflow: hidden;
    }
    .quota-row .q-bar-fill {
      height: 100%;
      border-radius: 3px;
      background: linear-gradient(90deg, #58a6ff, #79c0ff);
      transition: width 0.3s ease;
    }
    .quota-row .q-bar-fill.drained {
      background: linear-gradient(90deg, #f85149, #ff7b72);
    }
    .quota-row .q-count {
      flex: 0 0 52px;
      text-align: right;
      color: rgba(255, 255, 255, 0.7);
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }
    .quota-row .q-count.drained {
      color: #ff7b72;
      font-weight: 600;
    }
    .quota-reset {
      font-size: 0.7rem;
      color: rgba(255, 255, 255, 0.4);
      margin-top: 4px;
    }
    .quota-row.bound .q-model { font-weight: 600; color: #58a6ff; }
    .quota-row .q-bar-fill.unlimited { background: rgba(255, 255, 255, 0.15); }
    .quota-row .q-bar-fill.fresh { background: rgba(88, 166, 255, 0.25); width: 100% !important; }
    .quota-row .q-count.unlimited { flex-basis: 72px; color: rgba(255, 255, 255, 0.45); }
    .quota-row .q-count.fresh { flex-basis: 190px; color: rgba(88, 166, 255, 0.85); font-size: 0.68rem; }
    .model-tag {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 12px;
      border-radius: 6px;
      cursor: pointer;
      border: 1px solid rgba(255, 255, 255, 0.15);
      background: rgba(255, 255, 255, 0.03);
      opacity: 0.5;
      user-select: none;
      transition: all 0.2s ease;
      margin: 3px;
    }
    .model-tag.enabled {
      border-color: rgba(50, 205, 50, 0.3);
      background: rgba(50, 205, 50, 0.1);
      opacity: 1;
    }
    .model-tag:hover { opacity: 0.8; }
    .model-tag.enabled:hover { opacity: 1; }
    .model-tag-name {
      font-size: 11px;
      font-weight: 600;
      color: white;
      white-space: nowrap;
    }
    .model-tag-id {
      font-size: 9px;
      color: rgba(255, 255, 255, 0.5);
      white-space: nowrap;
    }
    .model-tag input[type="checkbox"] {
      pointer-events: none;
    }
    .ad-card {
      padding: 0 .5rem;
      position: relative;
      cursor: default;
      flex-grow: 1;
      display: flex;
      flex-direction: column;
    }
    .ad-glass-box {
      display: flex;
      align-items: stretch;
      gap: 0;
      flex: 1;
      min-height: 0;
      width: 100%;
    }
    .ad-glass-inner {
      flex: 1;
      min-width: 0;
      min-height: 0;
      position: relative;
      overflow: hidden;
      border-radius: 12px;
      background: rgba(255,255,255,0.5);
      border: 1px solid rgba(255,255,255,0.15);
      padding: 10px 12px;
      backdrop-filter: blur(13px);
      -webkit-backdrop-filter: blur(13px);
    }
    .ad-arrow {
      flex-shrink: 0;
      width: 32px;
      border-radius: 12px;
      background: rgba(255,255,255,0.15);
      border: none;
      color: rgba(0,0,0,0.35);
      font-size: 16px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: color 0.15s ease, background 0.15s ease;
      padding: 0;
      line-height: 1;
      backdrop-filter: blur(13px);
      -webkit-backdrop-filter: blur(13px);
    }
    .ad-arrow:hover {
      color: rgba(0,0,0,0.7);
    }
    .ad-arrow-left { margin-right: 4px; }
    .ad-arrow-right { margin-left: 4px; }
    #adSlidesContainer {
      display: grid;
    }
    #adSlidesContainer > * {
      grid-row: 1;
      grid-column: 1;
    }
    .ad-slide {
      opacity: 0;
      pointer-events: none;
      visibility: hidden;
    }
    .ad-slide.active {
      opacity: 1;
      pointer-events: auto;
      visibility: visible;
    }
    .ad-dot {
      cursor: pointer;
      padding: 4px;
    }
    .ad-dot .dot-indicator {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: rgba(0,0,0,0.2);
      transition: background 0.2s ease, transform 0.2s ease;
    }
    .ad-dot.active .dot-indicator {
      background: rgba(0,0,0,0.7);
      transform: scale(1.3);
    }
    .ad-header-bar {
      position: absolute;
      top: 2px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
      pointer-events: none;
    }
    .ad-header-bar .ad-label {
      font-size: 9px;
      color: rgba(255,255,255,0.7);
      text-transform: uppercase;
      letter-spacing: 1px;
    }
  </style>
</head>
<body>
  <svg style="position:absolute;overflow:hidden;width:0;height:0" color-interpolation-filters="sRGB">
    <defs id="glass-defs"></defs>
  </svg>

  <div class="container pt-2">
  <div class="row justify-content-center">
  <div class="dashboard-container col-11">
    <div class="card sticky-top p-0" style="top:0;z-index:100" data-glass>
      <div class="glass-panel"></div>
      <div class="card-content px-2">
        <div class="d-flex justify-content-between align-items-center">
          <div>
            <h4 class="mb-0"><i class="bi bi-lightning-charge-fill me-2"></i>Freebuff2OpenCode 控制台</h4>
          </div>
          <div class="text-end">
            <div>
              <span id="statusIndicator" class="status-indicator status-unknown"></span>
              <span id="statusText" class="fw-medium">检查中...</span>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div class="row text-center d-flex align-items-stretch mb-3">
      <div class="col-12 col-md-8">
        <div class="card h-100 d-flex flex-column" data-glass>
          <div class="glass-panel"></div>
          <div class="ad-card card-content flex-grow-1 d-flex flex-column">
            <div class="ad-header-bar">
              <span class="ad-label" id="adCounterLabel">广告</span>
            </div>
            <div class="ad-glass-box">
              <button class="ad-arrow ad-arrow-left" onclick="prevAd()" title="上一条广告"><i class="bi bi-chevron-left"></i></button>
              <div class="ad-glass-inner">
                <div id="adSlidesContainer"></div>
              </div>
              <button class="ad-arrow ad-arrow-right" onclick="nextAd()" title="下一条广告"><i class="bi bi-chevron-right"></i></button>
            </div>
            <div id="adDots" style="display:flex;justify-content:center;gap:4px;margin-top:6px"></div>
          </div>
        </div>
      </div>
      <div class="col-6 col-md-2"><div class="stats-card card h-100 d-flex flex-column" data-glass><div class="card-content flex-grow-1 justify-content-center align-items-center d-flex flex-column" style="padding:10px"><div class="stats-value" id="totalModels">0</div><div class="stats-label">模型数</div></div></div></div>
      <div class="col-6 col-md-2"><div class="stats-card card h-100 d-flex flex-column" data-glass><div class="card-content flex-grow-1 justify-content-center align-items-center d-flex flex-column" style="padding:10px"><div class="stats-value" id="countryCode">-</div><div class="stats-label">地区</div></div></div></div>
    </div>

    <div class="row">
      <div class="col-lg-8">
        <div class="card" data-glass data-section="tokens">
          <div class="glass-panel"></div>
          <div class="card-content">
            <div class="card-header collapsible-header d-flex justify-content-between align-items-center" onclick="toggleSection('tokens')">
              <span>
                <i class="bi bi-chevron-down toggle-icon me-1"></i>
                <i class="bi bi-key-fill me-2"></i>认证令牌状态
              </span>
              <span id="tokenRemainingTime" style="font-size:0.85rem;font-weight:600;color:#58a6ff"></span>
              <span class="badge bg-secondary" id="tokenCountBadge">0</span>
            </div>
            <div class="card-body collapse-section" id="section-tokens">
              <div id="tokenPoolsContainer"></div>
              <small class="text-muted" style="display:block;margin-top:10px;">
                令牌自动从 Freebuff CLI 检测（~/.config/manicode/credentials.json）
              </small>
            </div>
          </div>
        </div>
      </div>

      <div class="col-lg-4">
        <div id="oauthContainer" style="display:none"></div>
        <div class="card" data-glass data-section="models">
          <div class="glass-panel"></div>
          <div class="card-content">
            <div class="card-header collapsible-header d-flex justify-content-between align-items-center" onclick="toggleSection('models')">
              <span>
                <i class="bi bi-chevron-down toggle-icon me-1"></i>
                <i class="bi bi-cpu-fill me-2"></i>可用模型
              </span>
              <span class="badge bg-secondary" id="modelCountBadge">0</span>
            </div>
            <div class="card-body collapse-section" id="section-models">
              <div id="modelsContainer"></div>
            </div>
          </div>
        </div>

        <div class="card" data-glass data-section="actions">
          <div class="glass-panel"></div>
          <div class="card-content">
            <div class="card-header collapsible-header" onclick="toggleSection('actions')">
              <i class="bi bi-chevron-down toggle-icon collapsed me-1"></i>
              <i class="bi bi-lightning-charge-fill me-2"></i>快捷操作
            </div>
            <div class="card-body collapse-section collapsed" id="section-actions">
              <div class="d-grid gap-2">
                <button class="btn btn-outline-action" onclick="checkHealth()"><i class="bi bi-activity me-2"></i>检查健康状态</button>
                <button class="btn btn-outline-action" onclick="testConnection()"><i class="bi bi-wifi me-2"></i>测试连接</button>
                <button class="btn btn-outline-action" onclick="refreshModels()"><i class="bi bi-arrow-clockwise me-2"></i>刷新模型</button>
              </div>
            </div>
          </div>
        </div>

        <div class="card" data-glass data-section="env">
          <div class="glass-panel"></div>
          <div class="card-content">
            <div class="card-header collapsible-header" onclick="toggleSection('env')">
              <i class="bi bi-chevron-down toggle-icon collapsed me-1"></i>
              <i class="bi bi-info-circle-fill me-2"></i>环境信息
            </div>
            <div class="card-body collapse-section collapsed" id="section-env">
              <div class="mb-2">
                <small class="text-muted">运行时</small>
                <div class="fw-medium" id="runtimeInfo">-</div>
              </div>
              <div class="mb-2">
                <small class="text-muted">启动时间</small>
                <div class="fw-medium" id="startedAt">-</div>
              </div>

              <div class="mb-2">
                <div class="form-check form-switch">
                  <input class="form-check-input" type="checkbox" id="wallpaperToggle" onchange="toggleWallpaper()">
                  <label class="form-check-label text-muted" for="wallpaperToggle" style="cursor:pointer">启用壁纸</label>
                </div>
              </div>
              <div class="mb-2">
                <div class="form-check form-switch">
                  <input class="form-check-input" type="checkbox" id="adsToggleEnv" checked onchange="toggleAds(this.checked)">
                  <label class="form-check-label text-muted" for="adsToggleEnv" style="cursor:pointer">显示广告</label>
                </div>
              </div>
              <div class="mb-2">
                <div class="form-check form-switch">
                  <input class="form-check-input" type="checkbox" id="blurTokensEnv" onchange="toggleBlurTokens(this.checked)">
                  <label class="form-check-label text-muted" for="blurTokensEnv" style="cursor:pointer">隐私模式（令牌打码）</label>
                </div>
              </div>
            </div>
          </div>
        </div>

        <div class="card" data-glass data-section="config">
          <div class="glass-panel"></div>
          <div class="card-content">
            <div class="card-header collapsible-header" onclick="toggleSection('config')">
              <i class="bi bi-chevron-down toggle-icon collapsed me-1"></i>
              <i class="bi bi-gear-fill me-2"></i>代理配置
            </div>
            <div class="card-body collapse-section collapsed" id="section-config">
              <form id="configForm">
                <div class="row">
                  <div class="col-6 mb-2">
                    <label class="form-label" style="font-size:10px;margin-bottom:2px">监听地址</label>
                    <input type="text" class="form-control form-control-sm" id="listenAddr" value=":3001" onchange="saveConfigValue('listenAddr', 'listenAddr')">
                  </div>
                  <div class="col-6 mb-2">
                    <label class="form-label" style="font-size:10px;margin-bottom:2px">轮换间隔</label>
                    <input type="text" class="form-control form-control-sm" id="rotationInterval" value="6h" onchange="saveConfigValue('rotationInterval', 'rotationInterval')">
                  </div>
                </div>
                <div class="row">
                  <div class="col-8 mb-2">
                    <label class="form-label" style="font-size:10px;margin-bottom:2px">上游地址</label>
                    <input type="url" class="form-control form-control-sm" id="upstreamUrl" value="https://www.codebuff.com" onchange="saveConfigValue('upstreamUrl', 'upstreamBaseURL')">
                  </div>
                  <div class="col-4 mb-2">
                    <label class="form-label" style="font-size:10px;margin-bottom:2px">超时</label>
                    <input type="text" class="form-control form-control-sm" id="requestTimeout" value="15m" onchange="saveConfigValue('requestTimeout', 'requestTimeout')">
                  </div>
                </div>
              </form>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
  </div>
  </div>

  <div class="toast-container" id="toastContainer"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    const SURFACE_FNS = { convex_squircle: (x) => Math.pow(1 - Math.pow(1 - x, 4), 0.25) };
    function calcRefractionProfile(t, b, hf, ior, s) {

          const specUrl = genSpecMap(w, h, radius, bezelW * 2.5);
          const filterId = 'lg-' + (fi++);

          filter.setAttribute('id', filterId); filter.setAttribute('x', '-20%'); filter.setAttribute('y', '-20%'); filter.setAttribute('width', '140%'); filter.setAttribute('height', '140%');

          document.body.style.backgroundImage = `url("${data.url}")`;

    async function fetchAds() {
      if (!adsEnabled) return;
      try {
        const resp = await fetch('/api/ads');
        if (!resp.ok) return;
        const data = await resp.json();
        let ads = [];
        if (Array.isArray(data)) ads = data;
        else if (data && data.ads && Array.isArray(data.ads)) ads = data.ads;
        if (ads.length > 0) {
          adsList = ads.map(ad => ({
            adHtml: ad.html || ad.body || '',
            adTitle: ad.title || ad.name || '',
            adLink: ad.clickUrl || ad.ctaUrl || ad.link || ad.url || '#',
            adImage: ad.favicon || ad.image || ad.thumbnail || ad.logo || '',
            adSponsor: ad.sponsor || ad.advertiser || ad.company || '',
            adCallToAction: ad.cta || ad.callToAction || '',
            adDescription: ad.adText || ad.description || '',
            adImpUrl: ad.impUrl || ad.impressionUrl || ad.pixelUrl || ''
          }));
          currentAdIdx = 0;
          adImpressionSent.clear();
          try { localStorage.setItem('_cachedAds', JSON.stringify(adsList)); } catch (e) {}
        } else if (adsList.length === 0) {
          try { const cached = localStorage.getItem('_cachedAds'); if (cached) adsList = JSON.parse(cached); } catch (e) {}
        }
      } catch (e) {
        if (adsList.length === 0) {
          try { const cached = localStorage.getItem('_cachedAds'); if (cached) adsList = JSON.parse(cached); } catch (e2) {}
        }
      }
    }

    function rotateAd() {
      if (!adsEnabled || adsList.length === 0) return;
      currentAdIdx = (currentAdIdx + 1) % adsList.length;
      goToAdSlide(currentAdIdx);
    }

    function prevAd() {
      if (!adsEnabled || adsList.length === 0) return;
      currentAdIdx = (currentAdIdx - 1 + adsList.length) % adsList.length;
      goToAdSlide(currentAdIdx);
    }

    function nextAd() {
      if (!adsEnabled || adsList.length === 0) return;
      currentAdIdx = (currentAdIdx + 1) % adsList.length;
      goToAdSlide(currentAdIdx);
    }

    function goToAdSlide(idx) {
      const slides = document.querySelectorAll('.ad-slide');
      const dots = document.querySelectorAll('.ad-dot');
      slides.forEach((s, i) => s.classList.toggle('active', i === idx));
      dots.forEach((d, i) => d.classList.toggle('active', i === idx));
      currentAdIdx = idx;
      const counterLabel = document.getElementById('adCounterLabel');
      if (counterLabel && adsList.length > 0) {
        counterLabel.textContent = '广告 ' + (idx + 1) + '/' + adsList.length;
      }
      const ad = adsList[idx];
      if (ad && ad.adImpUrl && !adImpressionSent.has(idx)) {
        adImpressionSent.add(idx);
        fetch('/api/ads/impression', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ impUrl: ad.adImpUrl, mode: 'desktop' }) }).catch(() => {});
      }
    }

    function reportAdClick(idx) {
      const ad = adsList[idx];
      if (!ad || !ad.adImpUrl) return;
      fetch('/api/ads/click', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ impUrl: ad.adImpUrl }) }).catch(() => {});
    }

    function renderAdInTokenCard() {
      const slidesContainer = document.getElementById('adSlidesContainer');
      const dotsContainer = document.getElementById('adDots');
      const counterLabel = document.getElementById('adCounterLabel');
      const arrows = document.querySelectorAll('.ad-arrow');
      if (!slidesContainer || !dotsContainer) return;
      if (!adsEnabled) {
        slidesContainer.innerHTML = '<div style="font-size:12px;color:rgba(13,17,23,0.4);text-align:center;padding:12px 0">广告已禁用</div>';
        dotsContainer.innerHTML = '';
        if (counterLabel) counterLabel.textContent = '广告已关闭';
        arrows.forEach(a => a.style.display = 'none');
        return;
      }
      arrows.forEach(a => a.style.display = adsList.length > 1 ? '' : 'none');
      if (adsList.length === 0) {
        slidesContainer.innerHTML = '<div style="font-size:12px;color:rgba(13,17,23,0.4);text-align:center;padding:12px 0">暂无广告</div>';
        dotsContainer.innerHTML = '';
        if (counterLabel) counterLabel.textContent = '广告';
        return;
      }
      if (currentAdIdx >= adsList.length) currentAdIdx = 0;
      slidesContainer.innerHTML = adsList.map((ad, i) => {
        let inner = '';
        if (ad.adHtml) {
          inner = ad.adHtml;
        } else if (ad.adImage || ad.adTitle) {
          inner = `<div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap">
            ${ad.adImage ? `<img src="${escapeHtml(ad.adImage)}" alt="${escapeHtml(ad.adTitle)}" style="width:40px;height:40px;border-radius:6px;object-fit:cover;flex-shrink:0;border:1px solid rgba(255,255,255,0.15)">` : ''}
            <div style="flex:1;min-width:0">
              ${ad.adSponsor ? `<div style="font-size:9px;text-transform:uppercase;letter-spacing:1px;color:rgba(255,255,255,0.4);margin-bottom:1px;text-align:left">${escapeHtml(ad.adSponsor)}</div>` : ''}
              ${ad.adTitle ? `<div style="font-weight:600;font-size:12px;color:#0d1117;margin-bottom:1px;text-align:left">${escapeHtml(ad.adTitle)}</div>` : ''}
              ${ad.adDescription ? `<div style="font-size:10px;color:rgba(13,17,23,0.5);line-height:1.3;text-align:left">${escapeHtml(ad.adDescription)}</div>` : ''}
            </div>
            ${ad.adCallToAction ? `<a href="${escapeHtml(ad.adLink)}" target="_blank" rel="noopener sponsored" onclick="reportAdClick(${i})" style="background:rgba(13,17,23,0.1);border:1px solid rgba(13,17,23,0.2);color:#0d1117;padding:3px 10px;border-radius:5px;font-size:10px;font-weight:600;white-space:nowrap;flex-shrink:0;text-decoration:none">${escapeHtml(ad.adCallToAction)}</a>` : ''}
          </div>`;
        }
        if (!inner) inner = '<div style="font-size:12px;color:rgba(13,17,23,0.4)">无广告内容</div>';
        return `<div class="ad-slide${i === currentAdIdx ? ' active' : ''}" style="padding:4px 0">${inner}</div>`;
      }).join('');
      dotsContainer.innerHTML = adsList.map((_, i) => `<span class="ad-dot${i === currentAdIdx ? ' active' : ''}" onclick="goToAdSlide(${i})"><span class="dot-indicator"></span></span>`).join('');
      if (counterLabel) counterLabel.textContent = adsList.length > 1 ? '广告 ' + (currentAdIdx + 1) + '/' + adsList.length : '广告';
    }

    function renderQuotaBlock(quotaByModel, boundModel) {
      // 交叉展示：全部模型 + 服务端实时 quota 数据。
      // 准确标签策略（按官方：
      //   web/src/server/free-session/public-api.ts 的 RATE_LIMITS 表 + onlyUsedRateLimitsByModel）：
      //   1. 有 quota_by_model 数据且 limit > 0 → 进度条「已用 X/Y」
      //   2. 有 quota_by_model 数据且 limit == 0 → 「额度 0/0 · 当前不可用」
      //   3. 无 quota_by_model 数据 + premium:true → 「共享池·今日未消耗」
      //   4. 无 quota_by_model 数据 + premium:false → 「无独立额度·未列入限额表」
      // 注意：「无独立额度」等同官方「unlimited」语义（MiMo 2.5 当前的官方版 unlimited
      // 模型），但不应被读成「完全无限制」——当前会话级限制仍存在（pool-level）。
      const qMap = quotaByModel || {};
      // Include server-reported quota rows even when the model is hidden from
      // the public catalog (for example GLM, which is currently blacklisted).
      const list = [...new Set([
        ...(Array.isArray(models) ? models : []),
        ...Object.keys(qMap),
      ])];
      const tokens = (proxyData && proxyData.token_state) || [];
      // Prefer this token card's model; retain a fallback for older callers.
      const boundFull = boundModel || tokens.map(p => p.model || p.locked_model).filter(Boolean)[0] || null;
      const boundShort = boundFull ? boundFull.split('/').pop() : null;

      const rows = list.map(m => {
        const shortName = m.split('/').pop();
        const meta = modelMetadata[m] || {};
        const q = qMap[m] || null;
        const isPremium = !!meta.premium;
        const isBound = (boundFull && m === boundFull) || (boundShort && shortName === boundShort);
        const boundTag = isBound ? '<span class="badge bg-primary" style="font-size:0.55rem;margin-left:4px;vertical-align:middle">使用中</span>' : '';

        if (q && typeof q.limit === 'number' && q.limit > 0) {
          const used = q.recentCount ?? 0;
          const drained = used >= q.limit;
          const pct = Math.min(100, (used / q.limit) * 100);
          const label = meta.displayName || shortName;
          return `<div class="quota-row${isBound ? ' bound' : ''}${drained ? ' drained' : ''}">
            <span class="q-model" title="${escapeHtml(m)}">${escapeHtml(label)}${boundTag}</span>
            <span class="q-bar"><span class="q-bar-fill${drained ? ' drained' : ''}" style="width:${pct}%"></span></span>
            <span class="q-count${drained ? ' drained' : ''}">已用 ${used.toFixed(1)}/${q.limit}${drained ? ' · 已满' : ''}</span>
          </div>`;
        }
        if (q && typeof q.limit === 'number' && q.limit <= 0) {
          const label = meta.displayName || shortName;
          return `<div class="quota-row${isBound ? ' bound' : ''} drained">
            <span class="q-model" title="${escapeHtml(m)}">${escapeHtml(label)}${boundTag}</span>
            <span class="q-bar"><span class="q-bar-fill drained" style="width:100%"></span></span>
            <span class="q-count drained">额度 0/0 · 当前不可用</span>
          </div>`;
        }
        if (!isPremium) {
          // Server did not list this model in RATE_LIMITS — official semantics
          // (Minimax is cheap enough to leave unlimited). Fall through MiMo 2.5
          // is the explicitly-designated "unlimited" model as of 2026-08-18.
          const label = meta.displayName || shortName;
          return `<div class="quota-row${isBound ? ' bound' : ''}">
            <span class="q-model" title="${escapeHtml(m)}">${escapeHtml(label)}${boundTag}</span>
            <span class="q-bar"><span class="q-bar-fill unlimited"></span></span>
            <span class="q-count unlimited">无独立额度</span>
          </div>`;
        }
        // Premium model not seen today (filtered by onlyUsedRateLimitsByModel).
        const label = meta.displayName || shortName;
        return `<div class="quota-row${isBound ? ' bound' : ''}">
          <span class="q-model" title="${escapeHtml(m)}">${escapeHtml(label)}${boundTag}</span>
          <span class="q-bar"><span class="q-bar-fill fresh"></span></span>
          <span class="q-count fresh">共享池 · 今日未消耗</span>
        </div>`;
      }).join('');

      const tracked = Object.values(qMap);
      const firstReset = tracked.find(q => q.resetAt)?.resetAt;
      const resetLine = firstReset ? `<div class="quota-reset">重置于 ${new Date(firstReset).toLocaleString()}</div>` : '';
      const totalUsed = tracked.filter(q => (q.recentCount ?? 0) > 0).length;
      const note = `<div class="quota-reset" style="margin-top:6px">进度条来自官方 RATE_LIMITS；未列入该表 ⇒ 服务端未发放独立额度（官方 unlimited：MiMo 2.5 一行）</div>`;
      const title = `模型配额（共 ${list.length} 个 · ${totalUsed} 个今日有消耗）`;
      if (rows === '') return '';
      return `<div class="quota-block"><div class="quota-title">${title}</div>${rows}${resetLine}${note}</div>`;
    }

    function renderTokenPools() {
      const container = document.getElementById('tokenPoolsContainer');
      if (!proxyData || !proxyData.token_state || proxyData.token_state.length === 0) {
        container.innerHTML = `
          <div class="text-center py-4">
            <i class="bi bi-key" style="font-size:2rem;color:rgba(255,255,255,0.4)"></i>
            <p class="mt-2 text-muted">未检测到令牌</p>
            <button class="btn btn-sm btn-white-bg mt-2" onclick="startOAuth()"><i class="bi bi-shield-lock-fill me-1"></i>生成认证令牌</button>
          </div>`;
        return;
      }
      const blurClass = blurTokensEnabled ? 'token-blurred' : '';
      container.innerHTML = proxyData.token_state.map(pool => {
        const sessionStatus = pool.session_status || 'none';
        const statusClass = sessionStatus === 'active' ? 'status-online' : 'status-offline';
        const statusTextMap = { active: '活跃', none: '无会话', ended: '已结束', superseded: '被接管', country_blocked: '地区受限', model_locked: '模型锁定', rate_limited: '限流', spend_limited: '额度用尽', ip_capped: 'IP 上限', banned: '已封禁' };
        const statusText = statusTextMap[sessionStatus] || sessionStatus;
        const tier = pool.access_tier || null;
        const tierLabel = tier === 'full' ? '完整版 (full)' : tier === 'limited' ? '受限版 (limited)' : (tier || '未知档位');
        const tierBadge = tier
          ? `<span class="badge ${tier === 'full' ? 'bg-success' : 'bg-warning text-dark'}" style="font-size:0.7rem">${tierLabel}</span>`
          : '';
        const boundModel = pool.model || pool.locked_model || null;
        const boundLine = boundModel
          ? `<div style="margin-top:6px;font-size:0.78rem;color:#58a6ff;">正在使用：<span class="${blurClass}">${escapeHtml(boundModel.split('/').pop())}</span></div>`
          : '';
        const lockedModel = pool.locked_model || null;
        const cardClass = lockedModel ? 'pool-card locked' : 'pool-card';
        let runsHtml = '';
        if (pool.runs && pool.runs.length > 0) {
          runsHtml = pool.runs.map(run => `<div class="run-item"><span class="run-agent">${run.agent_id}</span><span class="${blurClass}">${run.run_id.substring(0, 8)}... | 运行中: ${run.inflight} | 请求: ${run.request_count}</span></div>`).join('');
        }
        let sessionInfo = '';
        if (pool.session_instance_id) {
          sessionInfo = `<div style="margin-top:8px;font-size:0.8rem;color:#ffffff;" class="${blurClass}">会话: ${pool.session_instance_id.substring(0,12)}...${pool.session_expires_at ? ' | 过期: ' + new Date(pool.session_expires_at).toLocaleTimeString() : ''}</div>`;
        }
        const lockedBadge = lockedModel ? `<div class="locked-model-badge"><i class="bi bi-lock-fill lock-icon"></i><span>已锁定: ${escapeHtml(lockedModel)}</span><button class="unlock-btn" onclick="unlockSession()">解锁</button></div>` : '';
        const quotaHtml = renderQuotaBlock(pool.quota_by_model, pool.model || pool.locked_model);
        return `<div class="${cardClass}"><div class="pool-header"><div class="pool-name">${pool.name} ${tierBadge}</div><div class="pool-status ${statusClass}">${statusText}</div></div>${boundLine}${runsHtml}${sessionInfo}${lockedBadge}${quotaHtml}${pool.last_error ? `<div class="text-danger" style="margin-top:8px;font-size:0.8rem;">${pool.last_error}</div>` : ''}</div>`;
      }).join('');
    }

    async function unlockSession() {
      try {
        const resp = await fetch('/api/session/unlock', { method: 'POST' });
        const data = await resp.json();
        if (data.ok) {
          showToast(`已解锁 ${data.unlocked_count} 个会话`, 'success');
          await checkHealth();
        } else {
          showToast(data.error || '解锁失败', 'danger');
        }
      } catch (e) {
        showToast('解锁失败: ' + e.message, 'danger');
      }
    }

    function getModelDisplayName(model) {
      const meta = modelMetadata[model];
      if (meta) {
        const prefix = meta.premium ? '[LIM] ' : '';
        return prefix + meta.displayName;
      }
      return model.split('/').pop();
    }

    function renderModels() {
      const container = document.getElementById('modelsContainer');
      document.getElementById('modelCountBadge').textContent = `${enabledModels.length}/${models.length}`;
      if (models.length === 0) { container.innerHTML = '<p class="text-muted">暂无可用模型</p>'; return; }
      container.innerHTML = `<div style="display:flex;flex-wrap:wrap;gap:3px">${models.map((model, idx) => {
        const isEnabled = enabledModels.includes(model);
        return `<div class="model-tag${isEnabled ? ' enabled' : ''}" onclick="toggleModel(${idx})" id="model-${idx}"><input type="checkbox" class="form-check-input"${isEnabled ? ' checked' : ''}><div><div class="model-tag-name">${escapeHtml(getModelDisplayName(model))}</div><div class="model-tag-id" title="${escapeHtml(model)}">${escapeHtml(model)}</div></div></div>`;
      }).join('')}</div>`;
    }

    function toggleModel(idx) {
      const model = models[idx];
      const tag = document.getElementById(`model-${idx}`);
      const checkbox = tag.querySelector('input[type="checkbox"]');
      const isCurrentlyEnabled = tag.classList.contains('enabled');
      if (isCurrentlyEnabled) {
        tag.classList.remove('enabled');
        checkbox.checked = false;
        enabledModels = enabledModels.filter(m => m !== model);
      } else {
        tag.classList.add('enabled');
        checkbox.checked = true;
        if (!enabledModels.includes(model)) enabledModels.push(model);
      }
      fetch('/api/config', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ enabledModels }) });
      document.getElementById('modelCountBadge').textContent = `${enabledModels.length}/${models.length}`;
      showToast(`${getModelDisplayName(model)} ${isCurrentlyEnabled ? '已禁用' : '已启用'}`, 'info');
    }

    async function startOAuth() {
      const container = document.getElementById('oauthContainer');
      container.style.display = 'block';
      container.innerHTML = '<div class="text-center py-3"><div class="spinner-border text-primary" role="status"></div><p class="mt-2 text-muted">正在生成登录链接...</p></div>';
      try {
        const response = await fetch('/api/auth/start', { method: 'POST' });
        const data = await response.json();
        if (!data.loginUrl) throw new Error('未收到登录链接');
        oauthSession = data;
        container.innerHTML = `
          <div class="mb-3">
            <label class="form-label">步骤 1：打开登录链接</label>
            <div class="input-group">
              <input type="text" class="form-control" id="oauthLoginUrl" value="${escapeHtml(data.loginUrl)}" readonly>
              <button class="btn btn-outline-action" onclick="copyToClipboard('oauthLoginUrl')">复制</button>
              <a class="btn btn-white-bg" href="${escapeHtml(data.loginUrl)}" target="_blank">打开</a>
            </div>
          </div>
          <div class="mb-3">
            <label class="form-label">步骤 2：粘贴回调链接</label>
            <input type="text" class="form-control" id="oauthCallbackUrl" placeholder="登录后粘贴回调链接...">
          </div>
          <button class="btn btn-white-bg w-100" onclick="verifyOAuth()"><i class="bi bi-check-circle me-2"></i>验证并获取令牌</button>
          <div id="oauthProgress" style="display:none;margin-top:10px;"><div class="progress"><div class="progress-bar progress-bar-striped progress-bar-animated" style="width:100%"></div></div></div>`;
        startOAuthPolling();
      } catch (error) {
        container.innerHTML = `<div class="text-center text-danger py-3"><i class="bi bi-exclamation-triangle" style="font-size:2rem"></i><p class="mt-2">${error.message}</p><button class="btn btn-sm btn-outline-action" onclick="startOAuth()">重试</button></div>`;
      }
    }

    function startOAuthPolling() {
      if (oauthPollTimer) clearInterval(oauthPollTimer);
      let attempts = 0;
      oauthPollTimer = setInterval(async () => {
        attempts++;
        if (attempts > 60) { clearInterval(oauthPollTimer); document.getElementById('oauthProgress').style.display = 'none'; showToast('登录超时', 'warning'); return; }
        try {
          const response = await fetch('/api/auth/status', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ fingerprintId: oauthSession.fingerprintId, fingerprintHash: oauthSession.fingerprintHash, expiresAt: oauthSession.expiresAt }) });
          const data = await response.json();
          if (data.user && data.user.authToken) {
            clearInterval(oauthPollTimer);
            const container = document.getElementById('oauthContainer');
            container.innerHTML = `<div class="text-center py-3"><div class="badge bg-success mb-3"><i class="bi bi-check-circle me-1"></i>已认证</div><p class="text-muted">令牌已添加！</p><p class="fw-medium">${escapeHtml(data.user.email || data.user.name)}</p><button class="btn btn-sm btn-outline-action mt-2" onclick="startOAuth()">再生成一个</button></div>`;
            showToast('认证令牌添加成功', 'success');
            loadConfiguration();
          }
        } catch (e) {}
      }, 2000);
    }

    async function verifyOAuth() {
      const callbackUrl = document.getElementById('oauthCallbackUrl').value.trim();
      if (!callbackUrl) { showToast('请粘贴回调链接', 'warning'); return; }
      document.getElementById('oauthProgress').style.display = 'block';
      try {
        const authCode = callbackUrl.includes('auth_code=') ? callbackUrl.split('auth_code=')[1].split('&')[0] : callbackUrl;
        const response = await fetch('/api/auth/verify', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ fingerprintId: oauthSession.fingerprintId, fingerprintHash: oauthSession.fingerprintHash, expiresAt: oauthSession.expiresAt, authCode }) });
        const data = await response.json();
        if (data.user && data.user.authToken) {
          clearInterval(oauthPollTimer);
          document.getElementById('oauthContainer').innerHTML = `<div class="text-center py-3"><div class="badge bg-success mb-3"><i class="bi bi-check-circle me-1"></i>已认证</div><p class="text-muted">令牌已添加！</p><p class="fw-medium">${escapeHtml(data.user.email || data.user.name)}</p><button class="btn btn-sm btn-outline-action mt-2" onclick="startOAuth()">再生成一个</button></div>`;
          showToast('认证令牌添加成功', 'success');
          loadConfiguration();
        } else {
          showToast('验证等待中 - 请先登录...', 'info');
        }
      } catch (error) {
        document.getElementById('oauthProgress').style.display = 'none';
        showToast('验证失败: ' + error.message, 'danger');
      }
    }

    function copyToClipboard(elementId) {
      const el = document.getElementById(elementId);
      el.select();
      document.execCommand('copy');
      showToast('已复制到剪贴板', 'info');
    }

    async function checkHealth(silent = false) {
      try {
        const response = await fetch('/healthz');
        const data = await response.json();
        if (data.ok) {
          proxyData = data;
          document.getElementById('statusIndicator').className = 'status-indicator status-online';
          document.getElementById('statusText').textContent = '在线';
          renderTokenPools();
          updateStats();
          if (!silent) showToast('代理运行正常', 'success');
        } else {
          throw new Error('状态异常');
        }
      } catch (error) {
        document.getElementById('statusIndicator').className = 'status-indicator status-offline';
        document.getElementById('statusText').textContent = '离线';
        if (!silent) showToast('代理健康检查失败', 'danger');
      }
    }

    async function testConnection() {
      try {
        const response = await fetch('/v1/models');
        if (response.ok) {
          const data = await response.json();
          showToast(`连接成功！${data.data?.length || 0} 个模型可用`, 'success');
        } else {
          throw new Error('连接失败');
        }
      } catch (error) {
        showToast('连接测试失败', 'danger');
      }
    }

    function refreshModels() {
      loadConfiguration();
      showToast('模型已刷新', 'info');
    }

    function updateRemainingDisplay() {
      const el = document.getElementById('tokenRemainingTime');
      if (!remainingMsAtFetch || !remainingMsTimestamp) { el.textContent = ''; return; }
      const elapsed = Date.now() - remainingMsTimestamp;
      const left = Math.max(0, remainingMsAtFetch - elapsed);
      if (left <= 0) { el.textContent = '已过期'; return; }
      const totalSec = Math.floor(left / 1000);
      const hrs = Math.floor(totalSec / 3600);
      const mins = Math.floor((totalSec % 3600) / 60);
      const secs = totalSec % 60;
      el.textContent = (hrs > 0 ? hrs + ' 小时 ' : '') + mins + ' 分 ' + secs + ' 秒剩余';
    }

    function updateStats() {
      if (!proxyData || !proxyData.token_state) return;
      document.getElementById('totalModels').textContent = models.length;
      document.getElementById('startedAt').textContent = new Date(proxyData.started_at).toLocaleString();
      document.getElementById('tokenCountBadge').textContent = proxyData.token_state.length;
      const bestToken = proxyData.token_state.find(t => t.country_code) || proxyData.token_state[0];
      const cc = bestToken?.country_code || '-';
      const tier = bestToken?.access_tier || '';
      const el = document.getElementById('countryCode');
      el.textContent = cc;
      if (tier === 'limited') {
        const small = document.createElement('small');
        small.textContent = '（受限）';
        small.style.marginLeft = '4px';
        small.style.opacity = '0.7';
        el.appendChild(small);
      }
      const activeToken = proxyData.token_state.find(t => t.remaining_ms && t.remaining_ms > 0);
      if (activeToken) {
        remainingMsAtFetch = activeToken.remaining_ms;
        remainingMsTimestamp = Date.now();
      } else {
        remainingMsAtFetch = 0;
        remainingMsTimestamp = 0;
      }
      updateRemainingDisplay();
      updateRemainingDisplay();
      if (proxyData.runtime) {
        document.getElementById('runtimeInfo').textContent = proxyData.runtime + ' v' + proxyData.runtime_version;
      }
    }

    function toggleSection(name) {
      const body = document.getElementById('section-' + name);
      const card = body.closest('[data-section]');
      const icon = card.querySelector('.toggle-icon');
      body.classList.toggle('collapsed');
      icon.classList.toggle('collapsed');
      setTimeout(() => initLiquidGlass(), 50);
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    document.addEventListener('DOMContentLoaded', () => {
      initLiquidGlass();
      try { const cached = localStorage.getItem('adsEnabled'); if (cached === 'false') { adsEnabled = false; const t = document.getElementById('adsToggleEnv'); if (t) t.checked = false; } } catch (e) {}
      loadConfiguration().then(() => { fetchBingWallpaper(); if (adsEnabled) fetchAds().then(() => { renderAdInTokenCard(); setTimeout(() => initLiquidGlass(), 100); }); else { renderAdInTokenCard(); setTimeout(() => initLiquidGlass(), 100); } });
      checkHealth();
      setInterval(() => checkHealth(true), 5000);
      setInterval(() => rotateAd(), 30000);
      setInterval(() => updateRemainingDisplay(), 1000);
    });
  </script>
</body>
</html>
