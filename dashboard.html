<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Free-Buff 控制台</title>
  <style>
    /* Self-contained UI: no CDN, no wallpaper, no SVG glass filters.
       Static gradient background + plain translucent cards — zero
       per-frame GPU compositing and zero external requests. */
    :root {
      --bg-0: #0b0f1a;
      --card-bg: rgba(22, 27, 41, 0.82);
      --card-border: rgba(255, 255, 255, 0.09);
      --header-bg: rgba(13, 17, 28, 0.92);
      --text: #e6edf3;
      --text-dim: rgba(230, 237, 243, 0.62);
      --accent: #58a6ff;
      --success: #3fb950;
      --warning: #d29922;
      --danger: #f85149;
      --radius: 10px;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      padding: 0;
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", Roboto, sans-serif;
      background:
        radial-gradient(1100px 500px at 15% -5%, rgba(56, 97, 251, 0.14), transparent 60%),
        radial-gradient(900px 480px at 90% 0%, rgba(46, 160, 67, 0.08), transparent 55%),
        radial-gradient(800px 600px at 50% 110%, rgba(163, 113, 247, 0.07), transparent 60%),
        var(--bg-0);
      background-attachment: fixed;
    }
    .dashboard-container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 12px 16px 40px;
    }
    /* --- layout grid (replaces bootstrap row/col) --- */
    .grid { display: grid; gap: 16px; margin-bottom: 16px; }
    .grid-top { grid-template-columns: 2fr 1fr; }
    .grid-main { grid-template-columns: 2fr 1fr; align-items: start; }
    @media (max-width: 900px) {
      .grid-top, .grid-main { grid-template-columns: 1fr; }
    }
    .stack { display: flex; flex-direction: column; gap: 16px; min-width: 0; }

    /* --- card --- */
    .card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: var(--radius);
      overflow: hidden;
    }
    .card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 9px 14px;
      background: rgba(255, 255, 255, 0.03);
      border-bottom: 1px solid var(--card-border);
      font-weight: 600;
      font-size: 13px;
      letter-spacing: 0.4px;
      cursor: pointer;
      user-select: none;
    }
    .card-header .hd-left { display: flex; align-items: center; gap: 7px; min-width: 0; }
    .card-header .badge {
      font-weight: 600;
      cursor: default;
    }
    .card-body { padding: 12px 14px; }
    .collapse-section.collapsed { display: none; }
    .toggle-icon { display: inline-block; transition: transform 0.2s ease; color: var(--text-dim); }
    .toggle-icon.collapsed { transform: rotate(-90deg); }

    /* --- top bar --- */
    .topbar {
      position: sticky;
      top: 0;
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 16px;
      margin-bottom: 16px;
      background: var(--header-bg);
      border-bottom: 1px solid var(--card-border);
      backdrop-filter: blur(6px);
    }
    .topbar h1 { margin: 0; font-size: 17px; font-weight: 700; }
    .status-wrap { display: flex; align-items: center; gap: 8px; font-size: 13px; }
    .status-indicator {
      width: 11px; height: 11px;
      border-radius: 50%;
      display: inline-block;
    }
    .status-online { background-color: var(--success); box-shadow: 0 0 8px var(--success); }
    .status-offline { background-color: var(--danger); box-shadow: 0 0 8px var(--danger); }
    .status-unknown { background-color: #6e7681; }

    /* --- stats tiles --- */
    .stats-row { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
    .stats-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: var(--radius);
      text-align: center;
      padding: 18px 10px;
    }
    .stats-value { font-size: 26px; font-weight: 700; }
    .stats-label { font-size: 11px; color: var(--text-dim); text-transform: uppercase; letter-spacing: 1px; margin-top: 4px; }

    /* --- timezone bar --- */
    .timezone-content {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      padding: 12px;
    }
    @media (max-width: 768px) { .timezone-content { grid-template-columns: repeat(2, 1fr); } }
    .tz-cell {
      display: flex; flex-direction: column; align-items: center;
      padding: 4px 6px;
      border-right: 1px solid rgba(255, 255, 255, 0.06);
      min-width: 0;
    }
    .tz-cell:last-child { border-right: none; }
    .tz-name { font-size: 0.68rem; color: var(--text-dim); margin-bottom: 4px; text-transform: uppercase; letter-spacing: 0.04em; white-space: nowrap; }
    .tz-clock { font-size: 1.3rem; font-weight: 600; font-variant-numeric: tabular-nums; letter-spacing: 0.04em; }
    .tz-meta { font-size: 0.68rem; color: var(--text-dim); margin-top: 2px; }
    .tz-meta.reset-soon { color: var(--warning); font-weight: 600; }
    .tz-badge {
      padding: 4px 12px;
      border-radius: 12px;
      font-size: 0.75rem;
      font-weight: 600;
      margin-top: 4px;
    }
    .tz-badge.available { background: rgba(63, 185, 80, 0.18); color: var(--success); border: 1px solid rgba(63, 185, 80, 0.35); }
    .tz-badge.unavailable { background: rgba(248, 81, 73, 0.13); color: var(--danger); border: 1px solid rgba(248, 81, 73, 0.30); }

    /* --- token pool cards --- */
    .pool-card {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--card-border);
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 10px;
    }
    .pool-card.locked { border-style: dashed; border-color: var(--warning); background: rgba(210, 153, 34, 0.06); }
    .pool-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; gap: 8px; }
    .pool-name { font-weight: 600; color: var(--accent); font-size: 0.95rem; }
    .pool-status { padding: 3px 10px; border-radius: 10px; font-size: 0.75rem; font-weight: 600; white-space: nowrap; }
    .locked-model-badge {
      display: inline-flex; align-items: center; gap: 5px;
      margin-top: 8px; padding: 4px 10px;
      border: 1px dashed var(--warning);
      border-radius: 6px;
      background: rgba(210, 153, 34, 0.1);
      font-size: 0.78rem;
      color: #e3b341;
      font-weight: 600;
    }
    .unlock-btn {
      margin-left: 8px; padding: 2px 10px;
      border: 1px solid var(--warning);
      border-radius: 5px;
      background: transparent;
      color: #e3b341;
      font-size: 0.72rem; font-weight: 600;
      cursor: pointer;
      transition: background 0.2s ease;
    }
    .unlock-btn:hover { background: rgba(210, 153, 34, 0.2); }

    /* --- quota block --- */
    .quota-block { margin-top: 10px; border-top: 1px solid rgba(255, 255, 255, 0.08); padding-top: 8px; }
    .quota-title { font-size: 0.72rem; font-weight: 600; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 6px; }
    .quota-reset-live { font-size: 0.72rem; font-weight: 600; color: rgba(230, 237, 243, 0.78); margin-bottom: 6px; }
    .quota-reset { font-size: 0.7rem; color: var(--text-dim); margin-top: 4px; }
    .quota-row { display: flex; align-items: center; gap: 8px; margin-bottom: 5px; font-size: 0.78rem; }
    .quota-row .q-model { flex: 0 0 150px; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .quota-row.bound .q-model { font-weight: 600; color: var(--accent); }
    .quota-row .q-bar { flex: 1 1 auto; height: 6px; border-radius: 3px; background: rgba(255, 255, 255, 0.08); overflow: hidden; }
    .quota-row .q-bar-fill { height: 100%; border-radius: 3px; background: linear-gradient(90deg, #58a6ff, #79c0ff); transition: width 0.3s ease; }
    .quota-row .q-bar-fill.drained { background: linear-gradient(90deg, #f85149, #ff7b72); }
    .quota-row .q-bar-fill.fresh { background: rgba(88, 166, 255, 0.25); width: 100% !important; }
    .quota-row .q-count { flex: 0 0 auto; text-align: right; color: var(--text-dim); font-variant-numeric: tabular-nums; white-space: nowrap; }
    .quota-row .q-count.drained { color: #ff7b72; font-weight: 600; }
    .quota-row .q-count.unknown { color: var(--text-dim); font-size: 0.68rem; }

    /* --- badges / misc --- */
    .badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 10px;
      font-size: 0.7rem;
      font-weight: 600;
      vertical-align: middle;
    }
    .badge.bg-success { background: rgba(35, 134, 54, 0.85); color: #fff; }
    .badge.bg-warning { background: rgba(210, 153, 34, 0.85); color: #14171c; }
    .badge.bg-secondary { background: rgba(110, 118, 129, 0.6); color: #fff; }
    .badge.bg-primary { background: rgba(31, 111, 235, 0.85); color: #fff; }
    .token-blurred { filter: blur(5px); transition: filter 0.2s ease; }
    .token-blurred:hover { filter: blur(0) !important; }
    .text-muted { color: var(--text-dim) !important; }
    small { color: rgba(230, 237, 243, 0.75); }
    .mono { font-family: ui-monospace, SFMono-Regular, Consolas, monospace; }

    /* --- buttons --- */
    button, .btn {
      font-family: inherit;
      cursor: pointer;
      border-radius: 6px;
      font-size: 0.82rem;
      padding: 6px 14px;
      transition: background 0.15s ease, border-color 0.15s ease;
    }
    .btn-white-bg { background: #e6edf3; border: 1px solid #e6edf3; color: #0d1117; font-weight: 600; }
    .btn-white-bg:hover { background: #fff; }
    .btn-outline-action { border: 1px solid rgba(240, 246, 252, 0.25); color: var(--text); background: transparent; }
    .btn-outline-action:hover { background: rgba(255, 255, 255, 0.08); border-color: rgba(240, 246, 252, 0.5); }
    .btn-sm { padding: 4px 10px; font-size: 0.76rem; }
    .btn-block { width: 100%; }
    .actions-grid { display: grid; gap: 8px; }

    /* --- forms --- */
    .form-label { font-weight: 600; font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px; color: var(--text-dim); margin-bottom: 4px; display: block; }
    .form-control {
      display: block; width: 100%;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: var(--text);
      padding: 6px 10px;
      font-size: 0.86rem;
      font-family: inherit;
      border-radius: 6px;
    }
    .form-control:focus { outline: none; border-color: var(--accent); background: rgba(255, 255, 255, 0.09); }
    .form-control::placeholder { color: rgba(230, 237, 243, 0.45); }
    .cfg-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .cfg-grid .span2 { grid-column: span 2; }
    .switch-row { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; font-size: 0.84rem; color: var(--text-dim); cursor: pointer; }
    .switch-row input[type="checkbox"] { width: 16px; height: 16px; accent-color: var(--accent); cursor: pointer; }
    .env-item { margin-bottom: 10px; }
    .env-item .v { font-weight: 600; margin-top: 2px; }

    /* --- models --- */
    .model-tag {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 6px 10px;
      border-radius: 6px;
      cursor: pointer;
      border: 1px solid rgba(255, 255, 255, 0.12);
      background: rgba(255, 255, 255, 0.03);
      opacity: 0.55;
      user-select: none;
      transition: opacity 0.15s ease, border-color 0.15s ease;
      margin: 3px;
    }
    .model-tag.enabled { border-color: rgba(63, 185, 80, 0.4); background: rgba(63, 185, 80, 0.08); opacity: 1; }
    .model-tag:hover { opacity: 0.85; }
    .model-tag-name { font-size: 11px; font-weight: 600; white-space: nowrap; }
    .model-tag-id { font-size: 9px; color: var(--text-dim); white-space: nowrap; }
    .model-tag input[type="checkbox"] { pointer-events: none; accent-color: var(--success); }

    /* --- ads --- */
    .ad-card { position: relative; display: flex; flex-direction: column; }
    .ad-header-bar { position: absolute; top: 4px; left: 50%; transform: translateX(-50%); z-index: 10; pointer-events: none; }
    .ad-header-bar .ad-label { font-size: 9px; color: var(--text-dim); text-transform: uppercase; letter-spacing: 1px; }
    .ad-glass-box { display: flex; align-items: stretch; gap: 4px; flex: 1; min-height: 0; width: 100%; }
    .ad-glass-inner {
      flex: 1; min-width: 0; min-height: 0;
      position: relative; overflow: hidden;
      border-radius: 8px;
      background: rgba(230, 237, 243, 0.92);
      border: 1px solid var(--card-border);
      padding: 10px 12px;
    }
    .ad-arrow {
      flex-shrink: 0; width: 30px;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid var(--card-border);
      color: var(--text-dim);
      font-size: 15px;
      display: flex; align-items: center; justify-content: center;
      padding: 0; line-height: 1;
    }
    .ad-arrow:hover { color: var(--text); background: rgba(255, 255, 255, 0.12); }
    #adSlidesContainer { display: grid; }
    #adSlidesContainer > * { grid-row: 1; grid-column: 1; }
    .ad-slide { opacity: 0; pointer-events: none; visibility: hidden; }
    .ad-slide.active { opacity: 1; pointer-events: auto; visibility: visible; }
    .ad-dot { cursor: pointer; padding: 4px; display: inline-block; }
    .ad-dot .dot-indicator { width: 6px; height: 6px; border-radius: 50%; background: rgba(255, 255, 255, 0.2); display: block; transition: background 0.2s ease, transform 0.2s ease; }
    .ad-dot.active .dot-indicator { background: rgba(230, 237, 243, 0.8); transform: scale(1.3); }
    .ad-dots { display: flex; justify-content: center; gap: 4px; margin-top: 6px; }

    /* --- oauth --- */
    .input-group { display: flex; gap: 6px; }
    .input-group .form-control { flex: 1; min-width: 0; }
    .oauth-progress { height: 6px; border-radius: 3px; background: rgba(255, 255, 255, 0.08); overflow: hidden; margin-top: 10px; }
    .oauth-progress .bar { height: 100%; width: 100%; background: var(--accent); animation: slide 1.2s ease-in-out infinite alternate; }
    @keyframes slide { from { transform: translateX(-30%); } to { transform: translateX(30%); } }
    .center-note { text-align: center; padding: 14px 0; color: var(--text-dim); }

    /* --- toast --- */
    .toast-container { position: fixed; top: 20px; right: 20px; z-index: 1050; display: flex; flex-direction: column; gap: 8px; }
    .toast-item {
      padding: 10px 16px;
      border-radius: 8px;
      color: #fff;
      font-size: 0.84rem;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.4);
      animation: toastIn 0.2s ease;
    }
    .toast-item.success { background: rgba(35, 134, 54, 0.95); }
    .toast-item.danger { background: rgba(196, 49, 74, 0.95); }
    .toast-item.info { background: rgba(31, 111, 235, 0.95); }
    .toast-item.warning { background: rgba(154, 106, 0, 0.95); }
    @keyframes toastIn { from { opacity: 0; transform: translateX(20px); } to { opacity: 1; transform: none; } }

    .empty-state { text-align: center; padding: 24px 0; }
    .empty-state .icon { font-size: 2rem; opacity: 0.5; }
  </style>
</head>
<body>
  <div class="topbar">
    <h1>⚡ Free-Buff 控制台</h1>
    <div class="status-wrap">
      <span id="statusIndicator" class="status-indicator status-unknown"></span>
      <span id="statusText">检查中...</span>
    </div>
  </div>

  <div class="dashboard-container">
    <div class="grid grid-top">
      <div class="card ad-card">
        <div class="ad-header-bar"><span class="ad-label" id="adCounterLabel">广告</span></div>
        <div class="card-body">
          <div class="ad-glass-box">
            <button class="ad-arrow ad-arrow-left" onclick="prevAd()" title="上一条广告">‹</button>
            <div class="ad-glass-inner">
              <div id="adSlidesContainer"></div>
            </div>
            <button class="ad-arrow ad-arrow-right" onclick="nextAd()" title="下一条广告">›</button>
          </div>
          <div class="ad-dots" id="adDots"></div>
        </div>
      </div>
      <div class="stats-row">
        <div class="stats-card"><div class="stats-value" id="totalModels">0</div><div class="stats-label">模型数</div></div>
        <div class="stats-card"><div class="stats-value" id="countryCode">-</div><div class="stats-label">地区</div></div>
      </div>
    </div>

    <div class="card" style="margin-bottom:16px">
      <div class="timezone-content">
        <div class="tz-cell">
          <div class="tz-name">🌏 北京时间</div>
          <div class="tz-clock" id="tzBj">--:--:--</div>
          <div class="tz-meta" id="tzBjDate">-</div>
        </div>
        <div class="tz-cell">
          <div class="tz-name">🕐 US Pacific (PT)</div>
          <div class="tz-clock" id="tzPt">--:--:--</div>
          <div class="tz-meta" id="tzPtMeta">重置倒计时 -</div>
        </div>
        <div class="tz-cell">
          <div class="tz-name">🕐 US Eastern (ET)</div>
          <div class="tz-clock" id="tzEt">--:--:--</div>
          <div class="tz-meta" id="tzEtMeta">Fable 时段基准</div>
        </div>
        <div class="tz-cell">
          <div class="tz-name">Fable 当前</div>
          <div id="tzFableStatus" class="tz-badge">--</div>
          <div class="tz-meta">9am ET – 5pm PT</div>
        </div>
      </div>
    </div>

    <div class="grid grid-main">
      <div class="stack">
        <div class="card" data-section="tokens">
          <div class="card-header" onclick="toggleSection('tokens')">
            <span class="hd-left"><i class="toggle-icon" id="icon-tokens">▾</i>🔑 认证令牌状态</span>
            <span style="display:flex;align-items:center;gap:8px">
              <span id="tokenRemainingTime" style="font-size:0.82rem;font-weight:600;color:var(--accent)"></span>
              <span class="badge bg-secondary" id="tokenCountBadge">0</span>
            </span>
          </div>
          <div class="card-body collapse-section" id="section-tokens">
            <div id="tokenPoolsContainer"></div>
            <small class="text-muted" style="display:block;margin-top:10px;">
              令牌自动从 Freebuff CLI 检测（~/.config/manicode/credentials.json）
            </small>
          </div>
        </div>

        <div class="card" data-section="config">
          <div class="card-header" onclick="toggleSection('config')">
            <span class="hd-left"><i class="toggle-icon collapsed" id="icon-config">▾</i>⚙️ 代理配置</span>
          </div>
          <div class="card-body collapse-section collapsed" id="section-config">
            <div class="cfg-grid">
              <div>
                <label class="form-label">监听地址</label>
                <input type="text" class="form-control" id="listenAddr" value=":3001" onchange="saveConfigValue('listenAddr', 'listenAddr')">
              </div>
              <div>
                <label class="form-label">轮换间隔</label>
                <input type="text" class="form-control" id="rotationInterval" value="6h" onchange="saveConfigValue('rotationInterval', 'rotationInterval')">
              </div>
              <div class="span2">
                <label class="form-label">上游地址</label>
                <input type="url" class="form-control" id="upstreamUrl" value="https://www.codebuff.com" onchange="saveConfigValue('upstreamUrl', 'upstreamBaseURL')">
              </div>
              <div>
                <label class="form-label">超时</label>
                <input type="text" class="form-control" id="requestTimeout" value="15m" onchange="saveConfigValue('requestTimeout', 'requestTimeout')">
              </div>
            </div>
          </div>
        </div>
      </div>

      <div class="stack">
        <div id="oauthContainer" style="display:none"></div>
        <div class="card" data-section="models">
          <div class="card-header" onclick="toggleSection('models')">
            <span class="hd-left"><i class="toggle-icon" id="icon-models">▾</i>🖥️ 可用模型</span>
            <span class="badge bg-secondary" id="modelCountBadge">0</span>
          </div>
          <div class="card-body collapse-section" id="section-models">
            <div id="modelsContainer"></div>
          </div>
        </div>

        <div class="card" data-section="actions">
          <div class="card-header" onclick="toggleSection('actions')">
            <span class="hd-left"><i class="toggle-icon collapsed" id="icon-actions">▾</i>⚡ 快捷操作</span>
          </div>
          <div class="card-body collapse-section collapsed" id="section-actions">
            <div class="actions-grid">
              <button class="btn btn-outline-action" onclick="checkHealth()">🩺 检查健康状态</button>
              <button class="btn btn-outline-action" onclick="testConnection()">📡 测试连接</button>
              <button class="btn btn-outline-action" onclick="refreshModels()">🔄 刷新模型</button>
            </div>
          </div>
        </div>

        <div class="card" data-section="env">
          <div class="card-header" onclick="toggleSection('env')">
            <span class="hd-left"><i class="toggle-icon collapsed" id="icon-env">▾</i>ℹ️ 环境信息</span>
          </div>
          <div class="card-body collapse-section collapsed" id="section-env">
            <div class="env-item">
              <small class="text-muted">运行时</small>
              <div class="v" id="runtimeInfo">-</div>
            </div>
            <div class="env-item">
              <small class="text-muted">启动时间</small>
              <div class="v" id="startedAt">-</div>
            </div>
            <label class="switch-row">
              <input type="checkbox" id="adsToggleEnv" checked onchange="toggleAds(this.checked)">
              显示广告
            </label>
            <label class="switch-row">
              <input type="checkbox" id="blurTokensEnv" onchange="toggleBlurTokens(this.checked)">
              隐私模式（令牌打码）
            </label>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="toast-container" id="toastContainer"></div>

  <script>
    let proxyData = null;
    let config = {};
    let models = [];
    let modelMetadata = {};
    let enabledModels = [];
    let blurTokensEnabled = false;
    let oauthSession = null;
    let oauthPollTimer = null;
    let adsEnabled = true;
    let remainingMsAtFetch = 0;
    let remainingMsTimestamp = 0;
    let adsList = [];
    let currentAdIdx = 0;
    let adImpressionSent = new Set();

    function showToast(message, type = 'info') {
      const toast = document.createElement('div');
      toast.className = `toast-item ${type}`;
      toast.textContent = message;
      document.getElementById('toastContainer').appendChild(toast);
      setTimeout(() => toast.remove(), 3000);
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text == null ? '' : String(text);
      return div.innerHTML;
    }

    async function saveConfigValue(elementId, configKey) {
      const value = document.getElementById(elementId).value;
      const payload = {};
      payload[configKey] = value;
      try {
        const resp = await fetch('/api/config', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
        const data = await resp.json();
        if (data.success) { showToast(configKey + ' 已保存', 'info'); config = data.config; }
      } catch (e) {}
    }

    function toggleBlurTokens(checked) {
      blurTokensEnabled = checked;
      renderTokenPools();
    }

    function toggleAds(checked) {
      adsEnabled = checked;
      try { localStorage.setItem('adsEnabled', checked); } catch (e) {}
      if (!checked) {
        renderAdInTokenCard();
      } else {
        fetchAds().then(renderAdInTokenCard);
      }
    }

    async function fetchAds() {
      if (!adsEnabled) return;
      try {
        const resp = await fetch('/api/ads');
        if (!resp.ok) return;
        const data = await resp.json();
        let ads = [];
        if (Array.isArray(data)) ads = data;
        else if (data && data.ads && Array.isArray(data.ads)) ads = data.ads;
        if (ads.length > 0) {
          adsList = ads.map(ad => ({
            adHtml: ad.html || ad.body || '',
            adTitle: ad.title || ad.name || '',
            adLink: ad.clickUrl || ad.ctaUrl || ad.link || ad.url || '#',
            adImage: ad.favicon || ad.image || ad.thumbnail || ad.logo || '',
            adSponsor: ad.sponsor || ad.advertiser || ad.company || '',
            adCallToAction: ad.cta || ad.callToAction || '',
            adDescription: ad.adText || ad.description || '',
            adImpUrl: ad.impUrl || ad.impressionUrl || ad.pixelUrl || ''
          }));
          currentAdIdx = 0;
          adImpressionSent.clear();
          try { localStorage.setItem('_cachedAds', JSON.stringify(adsList)); } catch (e) {}
        } else if (adsList.length === 0) {
          try { const cached = localStorage.getItem('_cachedAds'); if (cached) adsList = JSON.parse(cached); } catch (e) {}
        }
      } catch (e) {
        if (adsList.length === 0) {
          try { const cached = localStorage.getItem('_cachedAds'); if (cached) adsList = JSON.parse(cached); } catch (e2) {}
        }
      }
    }

    function rotateAd() {
      if (!adsEnabled || adsList.length === 0) return;
      goToAdSlide((currentAdIdx + 1) % adsList.length);
    }

    function prevAd() {
      if (!adsEnabled || adsList.length === 0) return;
      goToAdSlide((currentAdIdx - 1 + adsList.length) % adsList.length);
    }

    function nextAd() {
      if (!adsEnabled || adsList.length === 0) return;
      goToAdSlide((currentAdIdx + 1) % adsList.length);
    }

    function goToAdSlide(idx) {
      currentAdIdx = idx;
      renderAdInTokenCard();
    }

    function reportAdClick(idx) {
      const ad = adsList[idx];
      if (!ad || !ad.adImpUrl) return;
      fetch('/api/ads/click', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ impUrl: ad.adImpUrl }) }).catch(() => {});
    }

    function renderAdInTokenCard() {
      const slidesContainer = document.getElementById('adSlidesContainer');
      const dotsContainer = document.getElementById('adDots');
      const counterLabel = document.getElementById('adCounterLabel');
      if (!slidesContainer || !dotsContainer) return;
      if (!adsEnabled) {
        slidesContainer.innerHTML = '<div style="font-size:12px;color:#7a828e;text-align:center;padding:12px 0">广告已禁用</div>';
        dotsContainer.innerHTML = '';
        if (counterLabel) counterLabel.textContent = '广告已关闭';
        return;
      }
      if (adsList.length === 0) {
        slidesContainer.innerHTML = '<div style="font-size:12px;color:#7a828e;text-align:center;padding:12px 0">暂无广告</div>';
        dotsContainer.innerHTML = '';
        if (counterLabel) counterLabel.textContent = '广告';
        return;
      }
      if (currentAdIdx >= adsList.length) currentAdIdx = 0;
      slidesContainer.innerHTML = adsList.map((ad, i) => {
        let inner = '';
        if (ad.adHtml) {
          inner = ad.adHtml;
        } else if (ad.adImage || ad.adTitle) {
          inner = `<div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap">
            ${ad.adImage ? `<img src="${escapeHtml(ad.adImage)}" alt="${escapeHtml(ad.adTitle)}" style="width:40px;height:40px;border-radius:6px;object-fit:cover;flex-shrink:0;border:1px solid rgba(0,0,0,0.1)">` : ''}
            <div style="flex:1;min-width:0">
              ${ad.adSponsor ? `<div style="font-size:9px;text-transform:uppercase;letter-spacing:1px;color:rgba(13,17,23,0.4);margin-bottom:1px;text-align:left">${escapeHtml(ad.adSponsor)}</div>` : ''}
              ${ad.adTitle ? `<div style="font-weight:600;font-size:12px;color:#0d1117;margin-bottom:1px;text-align:left">${escapeHtml(ad.adTitle)}</div>` : ''}
              ${ad.adDescription ? `<div style="font-size:10px;color:rgba(13,17,23,0.5);line-height:1.3;text-align:left">${escapeHtml(ad.adDescription)}</div>` : ''}
            </div>
            ${ad.adCallToAction ? `<a href="${escapeHtml(ad.adLink)}" target="_blank" rel="noopener sponsored" onclick="reportAdClick(${i})" style="background:rgba(13,17,23,0.1);border:1px solid rgba(13,17,23,0.2);color:#0d1117;padding:3px 10px;border-radius:5px;font-size:10px;font-weight:600;white-space:nowrap;flex-shrink:0;text-decoration:none">${escapeHtml(ad.adCallToAction)}</a>` : ''}
          </div>`;
        }
        if (!inner) inner = '<div style="font-size:12px;color:rgba(13,17,23,0.4)">无广告内容</div>';
        return `<div class="ad-slide${i === currentAdIdx ? ' active' : ''}" style="padding:4px 0">${inner}</div>`;
      }).join('');
      dotsContainer.innerHTML = adsList.map((_, i) => `<span class="ad-dot${i === currentAdIdx ? ' active' : ''}" onclick="goToAdSlide(${i})"><span class="dot-indicator"></span></span>`).join('');
      if (counterLabel) counterLabel.textContent = adsList.length > 1 ? '广告 ' + (currentAdIdx + 1) + '/' + adsList.length : '广告';
      // Impression reporting for the newly active slide.
      const ad = adsList[currentAdIdx];
      if (ad && ad.adImpUrl && !adImpressionSent.has(currentAdIdx)) {
        adImpressionSent.add(currentAdIdx);
        fetch('/api/ads/impression', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ impUrl: ad.adImpUrl, mode: 'desktop' }) }).catch(() => {});
      }
    }

    async function loadConfiguration() {
      try {
        const healthResponse = await fetch('/healthz');
        proxyData = await healthResponse.json();
        const configResponse = await fetch('/api/config');
        const configData = await configResponse.json();
        if (configData) {
          const cfg = configData.config || configData;
          config = cfg;
          enabledModels = Array.isArray(cfg.enabledModels) ? cfg.enabledModels : [];
          if (document.getElementById('listenAddr')) document.getElementById('listenAddr').value = cfg.listenAddr || ':3001';
          if (document.getElementById('upstreamUrl')) document.getElementById('upstreamUrl').value = cfg.upstreamBaseURL || 'https://www.codebuff.com';
          if (document.getElementById('rotationInterval')) document.getElementById('rotationInterval').value = cfg.rotationInterval || '6h';
          if (document.getElementById('requestTimeout')) document.getElementById('requestTimeout').value = cfg.requestTimeout || '15m';
        }
        const modelsResponse = await fetch('/api/models');
        const modelsData = await modelsResponse.json();
        if (modelsData && modelsData.models) { models = modelsData.models; modelMetadata = modelsData.model_metadata || {}; renderModels(); }
        renderTokenPools();
        updateStats();
      } catch (error) {
        showToast('配置加载失败', 'danger');
      }
    }

    function renderQuotaBlock(quotaByModel, boundModel) {
      // 交叉展示：全部模型 + 服务端实时 quota 数据。
      // 标签策略：
      //   1. 有 quota_by_model 数据且 limit > 0 → 进度条「已用 X/Y」
      //   2. 有 quota_by_model 数据且 limit == 0 → 「额度 0/0 · 当前不可用」
      //   3. 无 quota_by_model 数据 → 不伪造额度，显示「暂无实时配额」
      const qMap = quotaByModel || {};
      // Include server-reported quota rows even when the model is hidden from
      // the public catalog (for example GLM, which is currently blacklisted).
      const list = [...new Set([
        ...(Array.isArray(models) ? models : []),
        ...Object.keys(qMap),
      ])];
      const tokens = (proxyData && proxyData.token_state) || [];
      const boundFull = boundModel || tokens.map(p => p.model || p.locked_model).filter(Boolean)[0] || null;
      const boundShort = boundFull ? boundFull.split('/').pop() : null;
      const detail = tokens.find(p => (p.model || p.locked_model) === boundFull)?.session_detail
        || tokens[0]?.session_detail || null;
      const closedModel = detail?.status === 'model_unavailable'
        ? (detail.requestedModel || detail.currentModel || null) : null;

      const rows = list.map(m => {
        const shortName = m.split('/').pop();
        const meta = modelMetadata[m] || {};
        const q = qMap[m] || null;
        const isBound = (boundFull && m === boundFull) || (boundShort && shortName === boundShort);
        const boundTag = isBound ? '<span class="badge bg-primary" style="font-size:0.55rem;margin-left:4px">使用中</span>' : '';

        if (closedModel && m === closedModel) {
          const label = meta.displayName || shortName;
          const reason = detail.availableHours ? `当前不可用 · ${detail.availableHours}` : '当前不可用';
          return `<div class="quota-row${isBound ? ' bound' : ''}">
            <span class="q-model" title="${escapeHtml(m)}">${escapeHtml(label)}${boundTag}</span>
            <span class="q-bar"><span class="q-bar-fill drained" style="width:100%"></span></span>
            <span class="q-count drained">${escapeHtml(reason)}</span>
          </div>`;
        }

        if (q && typeof q.limit === 'number' && q.limit > 0) {
          const used = q.recentCount ?? 0;
          const drained = used >= q.limit;
          const pct = Math.min(100, (used / q.limit) * 100);
          const label = meta.displayName || shortName;
          return `<div class="quota-row${isBound ? ' bound' : ''}">
            <span class="q-model" title="${escapeHtml(m)}">${escapeHtml(label)}${boundTag}</span>
            <span class="q-bar"><span class="q-bar-fill${drained ? ' drained' : ''}" style="width:${pct}%"></span></span>
            <span class="q-count${drained ? ' drained' : ''}">已用 ${used.toFixed(1)}/${q.limit}${drained ? ' · 已满' : ''}</span>
          </div>`;
        }
        if (q && typeof q.limit === 'number' && q.limit <= 0) {
          const label = meta.displayName || shortName;
          return `<div class="quota-row${isBound ? ' bound' : ''}">
            <span class="q-model" title="${escapeHtml(m)}">${escapeHtml(label)}${boundTag}</span>
            <span class="q-bar"><span class="q-bar-fill drained" style="width:100%"></span></span>
            <span class="q-count drained">额度 0/0 · 当前不可用</span>
          </div>`;
        }
        // The server omitted this model from rateLimitsByModel. This is not
        // enough evidence to call it unlimited or available.
        const label = meta.displayName || shortName;
        return `<div class="quota-row${isBound ? ' bound' : ''}">
          <span class="q-model" title="${escapeHtml(m)}">${escapeHtml(label)}${boundTag}</span>
          <span class="q-bar"><span class="q-bar-fill fresh"></span></span>
          <span class="q-count unknown">暂无实时配额</span>
        </div>`;
      }).join('');

      const tracked = Object.values(qMap);
      // Reset line: earliest resetAt across server-reported quotas, rendered
      // as a live countdown (element re-filled by updateQuotaResetCountdown
      // every second). Placed at the TOP of the block — buried at the bottom
      // of a long model list it was effectively invisible.
      const firstReset = tracked.find(q => q.resetAt)?.resetAt;
      let resetLine = '';
      if (firstReset) {
        const ts = new Date(firstReset).getTime();
        if (!Number.isNaN(ts)) {
          if (ts > Date.now()) {
            resetLine = `<div class="quota-reset-live">⏳ 配额重置：<span data-reset-at="${ts}"></span>（太平洋时间午夜）</div>`;
          } else {
            resetLine = `<div class="quota-reset-live">✅ 已过重置点 ${new Date(firstReset).toLocaleString()}（等待服务端刷新）</div>`;
          }
        }
      }
      const totalUsed = tracked.filter(q => (q.recentCount ?? 0) > 0).length;
      const note = `<div class="quota-reset" style="margin-top:6px">仅服务端返回的 rateLimitsByModel 显示额度；未返回不代表可用或无限</div>`;
      const title = `模型配额（共 ${list.length} 个 · ${totalUsed} 个今日有消耗）`;
      if (rows === '') return '';
      return `<div class="quota-block"><div class="quota-title">${title}</div>${resetLine}${rows}${note}</div>`;
    }

    // Fill every [data-reset-at] with a live "Xh Ym Zs" countdown. Runs on the
    // shared 1s tick; cheap because it only touches a handful of spans.
    function updateQuotaResetCountdown() {
      const els = document.querySelectorAll('[data-reset-at]');
      for (const el of els) {
        const left = (+el.dataset.resetAt) - Date.now();
        if (left <= 0) { el.textContent = '已到重置时间'; continue; }
        const totalSec = Math.floor(left / 1000);
        const h = Math.floor(totalSec / 3600);
        const m = Math.floor((totalSec % 3600) / 60);
        const s = totalSec % 60;
        el.textContent = `${h} 小时 ${m} 分 ${s} 秒后`;
      }
    }

    function renderTokenPools() {
      const container = document.getElementById('tokenPoolsContainer');
      if (!proxyData || !proxyData.token_state || proxyData.token_state.length === 0) {
        container.innerHTML = `
          <div class="empty-state">
            <div class="icon">🔑</div>
            <p class="text-muted">未检测到令牌</p>
            <button class="btn btn-white-bg btn-sm" onclick="startOAuth()">生成认证令牌</button>
          </div>`;
        return;
      }
      const blurClass = blurTokensEnabled ? 'token-blurred' : '';
      container.innerHTML = proxyData.token_state.map(pool => {
        const sessionStatus = pool.session_status || 'none';
        const statusTextMap = { active: '活跃', none: '无会话', queued: '排队中', ended: '已结束', superseded: '被接管', country_blocked: '地区受限', model_locked: '模型锁定', model_unavailable: '时段不可用', premium_slot_taken: '高级会话被占用', waiting_room_required: '需要重新排队', rate_limited: '限流', spend_limited: '额度用尽', ip_capped: 'IP 上限', banned: '已封禁', session_limit_reached: '会话数已满' };
        const detail = pool.session_detail || {};
        const status = detail.status || sessionStatus;
        const statusClass = status === 'active' ? 'status-online' : 'status-offline';
        const statusText = statusTextMap[status] || status;
        const tier = pool.access_tier || null;
        const tierLabel = tier === 'full' ? '完整版 (full)' : tier === 'limited' ? '受限版 (limited)' : (tier || '未知档位');
        const tierBadge = tier
          ? `<span class="badge ${tier === 'full' ? 'bg-success' : 'bg-warning'}" style="font-size:0.7rem">${tierLabel}</span>`
          : '';
        const boundModel = pool.model || pool.locked_model || null;
        const boundLine = boundModel
          ? `<div style="margin-top:6px;font-size:0.78rem;color:var(--accent)">正在使用：<span class="${blurClass}">${escapeHtml(boundModel.split('/').pop())}</span></div>`
          : '';
        const lockedModel = pool.locked_model || null;
        const cardClass = lockedModel ? 'pool-card locked' : 'pool-card';
        let runsHtml = '';
        if (pool.runs && pool.runs.length > 0) {
          runsHtml = pool.runs.map(run => `<div style="margin-top:4px;font-size:0.75rem;color:var(--text-dim)"><span class="mono">${escapeHtml(run.agent_id)}</span> <span class="${blurClass}">${escapeHtml(run.run_id.substring(0, 8))}... | 运行中: ${run.inflight} | 请求: ${run.request_count}</span></div>`).join('');
        }
        let sessionInfo = '';
        if (pool.session_instance_id) {
          sessionInfo = `<div style="margin-top:8px;font-size:0.78rem;" class="${blurClass}">会话: ${escapeHtml(pool.session_instance_id.substring(0, 12))}...${pool.session_expires_at ? ' | 过期: ' + new Date(pool.session_expires_at).toLocaleTimeString() : ''}</div>`;
        }
        const lockedBadge = lockedModel ? `<div class="locked-model-badge">🔒<span>已锁定: ${escapeHtml(lockedModel)}</span><button class="unlock-btn" onclick="unlockSession()">解锁</button></div>` : '';
        const detailHtml = detail.message || detail.availableHours
          ? `<div class="quota-reset" style="margin-top:8px;color:#e3b341">${escapeHtml(detail.message || ('可用时段：' + detail.availableHours))}</div>` : '';
        const quotaHtml = renderQuotaBlock(pool.quota_by_model, pool.model || pool.locked_model);
        return `<div class="${cardClass}"><div class="pool-header"><div class="pool-name">${escapeHtml(pool.name)} ${tierBadge}</div><div class="pool-status"><span class="status-indicator ${statusClass}" style="width:8px;height:8px;margin-right:5px"></span>${statusText}</div></div>${boundLine}${runsHtml}${sessionInfo}${lockedBadge}${detailHtml}${quotaHtml}</div>`;
      }).join('');
    }

    async function unlockSession() {
      try {
        const resp = await fetch('/api/session/unlock', { method: 'POST' });
        const data = await resp.json();
        if (data.ok) {
          showToast(`已解锁 ${data.unlocked_count} 个会话`, 'success');
          await checkHealth();
        } else {
          showToast(data.error || '解锁失败', 'danger');
        }
      } catch (e) {
        showToast('解锁失败: ' + e.message, 'danger');
      }
    }

    function getModelDisplayName(model) {
      const meta = modelMetadata[model];
      if (meta) {
        const prefix = meta.premium ? '[LIM] ' : '';
        return prefix + meta.displayName;
      }
      return model.split('/').pop();
    }

    function renderModels() {
      const container = document.getElementById('modelsContainer');
      document.getElementById('modelCountBadge').textContent = `${enabledModels.length}/${models.length}`;
      if (models.length === 0) { container.innerHTML = '<p class="text-muted">暂无可用模型</p>'; return; }
      container.innerHTML = `<div style="display:flex;flex-wrap:wrap;gap:3px">${models.map((model, idx) => {
        const isEnabled = enabledModels.includes(model);
        return `<div class="model-tag${isEnabled ? ' enabled' : ''}" onclick="toggleModel(${idx})" id="model-${idx}"><input type="checkbox"${isEnabled ? ' checked' : ''}><div><div class="model-tag-name">${escapeHtml(getModelDisplayName(model))}</div><div class="model-tag-id" title="${escapeHtml(model)}">${escapeHtml(model)}</div></div></div>`;
      }).join('')}</div>`;
    }

    function toggleModel(idx) {
      const model = models[idx];
      const tag = document.getElementById(`model-${idx}`);
      const checkbox = tag.querySelector('input[type="checkbox"]');
      const isCurrentlyEnabled = tag.classList.contains('enabled');
      if (isCurrentlyEnabled) {
        tag.classList.remove('enabled');
        checkbox.checked = false;
        enabledModels = enabledModels.filter(m => m !== model);
      } else {
        tag.classList.add('enabled');
        checkbox.checked = true;
        if (!enabledModels.includes(model)) enabledModels.push(model);
      }
      fetch('/api/config', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ enabledModels }) });
      document.getElementById('modelCountBadge').textContent = `${enabledModels.length}/${models.length}`;
      showToast(`${getModelDisplayName(model)} ${isCurrentlyEnabled ? '已禁用' : '已启用'}`, 'info');
    }

    async function startOAuth() {
      const container = document.getElementById('oauthContainer');
      container.style.display = 'block';
      container.innerHTML = '<div class="card"><div class="card-body center-note">正在生成登录链接...</div></div>';
      try {
        const response = await fetch('/api/auth/start', { method: 'POST' });
        const data = await response.json();
        if (!data.loginUrl) throw new Error('未收到登录链接');
        oauthSession = data;
        container.innerHTML = `
          <div class="card">
            <div class="card-body">
              <div style="margin-bottom:12px">
                <label class="form-label">步骤 1：打开登录链接</label>
                <div class="input-group">
                  <input type="text" class="form-control" id="oauthLoginUrl" value="${escapeHtml(data.loginUrl)}" readonly>
                  <button class="btn btn-outline-action btn-sm" onclick="copyToClipboard('oauthLoginUrl')">复制</button>
                  <a class="btn btn-white-bg btn-sm" href="${escapeHtml(data.loginUrl)}" target="_blank" rel="noopener" style="text-decoration:none;display:inline-flex;align-items:center">打开</a>
                </div>
              </div>
              <div style="margin-bottom:12px">
                <label class="form-label">步骤 2：粘贴回调链接</label>
                <input type="text" class="form-control" id="oauthCallbackUrl" placeholder="登录后粘贴回调链接...">
              </div>
              <button class="btn btn-white-bg btn-block" onclick="verifyOAuth()">✔ 验证并获取令牌</button>
              <div id="oauthProgress" class="oauth-progress" style="display:none"><div class="bar"></div></div>
            </div>
          </div>`;
        startOAuthPolling();
      } catch (error) {
        container.innerHTML = `<div class="card"><div class="card-body center-note"><div style="color:var(--danger)">⚠️ ${escapeHtml(error.message)}</div><button class="btn btn-outline-action btn-sm" style="margin-top:8px" onclick="startOAuth()">重试</button></div></div>`;
      }
    }

    function oauthDoneHtml(email) {
      return `<div class="card"><div class="card-body center-note"><span class="badge bg-success">✔ 已认证</span><p class="text-muted" style="margin:8px 0 4px">令牌已添加！</p><div style="font-weight:600">${escapeHtml(email || '')}</div><button class="btn btn-outline-action btn-sm" style="margin-top:10px" onclick="startOAuth()">再生成一个</button></div></div>`;
    }

    function startOAuthPolling() {
      if (oauthPollTimer) clearInterval(oauthPollTimer);
      let attempts = 0;
      oauthPollTimer = setInterval(async () => {
        attempts++;
        if (attempts > 60) { clearInterval(oauthPollTimer); const p = document.getElementById('oauthProgress'); if (p) p.style.display = 'none'; showToast('登录超时', 'warning'); return; }
        try {
          const response = await fetch('/api/auth/status', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ fingerprintId: oauthSession.fingerprintId, fingerprintHash: oauthSession.fingerprintHash, expiresAt: oauthSession.expiresAt }) });
          const data = await response.json();
          if (data.user && data.user.authToken) {
            clearInterval(oauthPollTimer);
            document.getElementById('oauthContainer').innerHTML = oauthDoneHtml(data.user.email || data.user.name);
            showToast('认证令牌添加成功', 'success');
            loadConfiguration();
          }
        } catch (e) {}
      }, 2000);
    }

    async function verifyOAuth() {
      const callbackUrl = document.getElementById('oauthCallbackUrl').value.trim();
      if (!callbackUrl) { showToast('请粘贴回调链接', 'warning'); return; }
      document.getElementById('oauthProgress').style.display = 'block';
      try {
        const authCode = callbackUrl.includes('auth_code=') ? callbackUrl.split('auth_code=')[1].split('&')[0] : callbackUrl;
        const response = await fetch('/api/auth/verify', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ fingerprintId: oauthSession.fingerprintId, fingerprintHash: oauthSession.fingerprintHash, expiresAt: oauthSession.expiresAt, authCode }) });
        const data = await response.json();
        if (data.user && data.user.authToken) {
          clearInterval(oauthPollTimer);
          document.getElementById('oauthContainer').innerHTML = oauthDoneHtml(data.user.email || data.user.name);
          showToast('认证令牌添加成功', 'success');
          loadConfiguration();
        } else {
          showToast('验证等待中 - 请先登录...', 'info');
        }
      } catch (error) {
        document.getElementById('oauthProgress').style.display = 'none';
        showToast('验证失败: ' + error.message, 'danger');
      }
    }

    function copyToClipboard(elementId) {
      const el = document.getElementById(elementId);
      el.select();
      try { navigator.clipboard.writeText(el.value); } catch (_) { document.execCommand('copy'); }
      showToast('已复制到剪贴板', 'info');
    }

    let _lastHealthSig = '';
    async function checkHealth(silent = false) {
      try {
        const response = await fetch('/healthz');
        const data = await response.json();
        if (data.ok) {
          proxyData = data;
          document.getElementById('statusIndicator').className = 'status-indicator status-online';
          document.getElementById('statusText').textContent = '在线';
          // Rebuilding every token card (quota bars included) every 5s caused
          // visible jank. Only touch the DOM when the payload actually changed.
          const sig = JSON.stringify([data.token_state, data.models_count, data.valid_tokens]);
          if (sig !== _lastHealthSig) {
            _lastHealthSig = sig;
            renderTokenPools();
            updateStats();
            updateQuotaResetCountdown();
          }
          if (!silent) showToast('代理运行正常', 'success');
        } else {
          throw new Error('状态异常');
        }
      } catch (error) {
        document.getElementById('statusIndicator').className = 'status-indicator status-offline';
        document.getElementById('statusText').textContent = '离线';
        if (!silent) showToast('代理健康检查失败', 'danger');
      }
    }

    async function testConnection() {
      try {
        const response = await fetch('/v1/models');
        if (response.ok) {
          const data = await response.json();
          showToast(`连接成功！${data.data?.length || 0} 个模型可用`, 'success');
        } else {
          throw new Error('连接失败');
        }
      } catch (error) {
        showToast('连接测试失败', 'danger');
      }
    }

    function refreshModels() {
      loadConfiguration();
      showToast('模型已刷新', 'info');
    }

    function updateRemainingDisplay() {
      const el = document.getElementById('tokenRemainingTime');
      if (!el) return;
      if (!remainingMsAtFetch || !remainingMsTimestamp) { el.textContent = ''; return; }
      const elapsed = Date.now() - remainingMsTimestamp;
      const left = Math.max(0, remainingMsAtFetch - elapsed);
      if (left <= 0) { el.textContent = '已过期'; return; }
      const totalSec = Math.floor(left / 1000);
      const hrs = Math.floor(totalSec / 3600);
      const mins = Math.floor((totalSec % 3600) / 60);
      const secs = totalSec % 60;
      el.textContent = (hrs > 0 ? hrs + ' 小时 ' : '') + mins + ' 分 ' + secs + ' 秒剩余';
    }

    function updateStats() {
      if (!proxyData || !proxyData.token_state) return;
      document.getElementById('totalModels').textContent = models.length;
      document.getElementById('startedAt').textContent = new Date(proxyData.started_at).toLocaleString();
      document.getElementById('tokenCountBadge').textContent = proxyData.token_state.length;
      const bestToken = proxyData.token_state.find(t => t.country_code) || proxyData.token_state[0];
      const cc = bestToken?.country_code || '-';
      const tier = bestToken?.access_tier || '';
      const el = document.getElementById('countryCode');
      el.textContent = cc;
      el.title = tier === 'limited' ? '受限档位 (limited)' : tier === 'full' ? '完整档位 (full)' : '';
      const activeToken = proxyData.token_state.find(t => t.remaining_ms && t.remaining_ms > 0);
      if (activeToken) {
        remainingMsAtFetch = activeToken.remaining_ms;
        remainingMsTimestamp = Date.now();
      } else {
        remainingMsAtFetch = 0;
        remainingMsTimestamp = 0;
      }
      updateRemainingDisplay();
      if (proxyData.runtime) {
        document.getElementById('runtimeInfo').textContent = proxyData.runtime + ' v' + proxyData.runtime_version;
      }
    }

    function toggleSection(name) {
      document.getElementById('section-' + name).classList.toggle('collapsed');
      document.getElementById('icon-' + name).classList.toggle('collapsed');
    }

    // --- Timezone bar: live Beijing / US Pacific / US Eastern clocks + fable ---
    // The official Freebuff premium-quota period is "pacific_day", with reset at
    // America/Los_Angeles midnight. Fable (`claude-fable-5`) is only reachable
    // during the "deployment hours" window 9am ET – 5pm PT. Showing all three
    // zones side-by-side lets a user on a US proxy node reason about quota
    // resets and fable availability in their local (Beijing) time.
    const _tzFmtCache = new Map();
    function tzParts(tz, fields) {
      const key = tz + '|' + fields.join(',');
      let fmt = _tzFmtCache.get(key);
      if (!fmt) {
        fmt = new Intl.DateTimeFormat('en-GB', { timeZone: tz, hour12: false, ...Object.fromEntries(fields.map(f => [f, '2-digit'])) });
        _tzFmtCache.set(key, fmt);
      }
      const parts = fmt.formatToParts(new Date());
      const out = {};
      for (const p of parts) if (p.type !== 'literal') out[p.type] = p.value;
      return out;
    }
    function fmtTzClock(tz) {
      const p = tzParts(tz, ['hour', 'minute', 'second']);
      return `${p.hour}:${p.minute}:${p.second}`;
    }
    function fmtTzDate(tz) {
      const fmt = _tzFmtCache.get(tz + '|date') || new Intl.DateTimeFormat('zh-CN', { timeZone: tz, month: 'short', day: 'numeric', weekday: 'short' });
      _tzFmtCache.set(tz + '|date', fmt);
      return fmt.format(new Date());
    }
    function ptResetCountdown() {
      // Seconds elapsed since the most recent PT midnight; subtract from 24h
      // to get the countdown. This avoids needing a DST-aware UTC offset.
      const p = tzParts('America/Los_Angeles', ['hour', 'minute', 'second']);
      const elapsed = (+p.hour % 24) * 3600 + (+p.minute) * 60 + (+p.second);
      const remain = 86400 - elapsed;
      const h = Math.floor(remain / 3600);
      const m = Math.floor((remain % 3600) / 60);
      return { h, m, s: remain };
    }
    function fableAvailability() {
      // This is only a local estimate for the timezone bar. The server's
      // model_unavailable/availableHours response is authoritative because the
      // deployment window uses US timezones and DST rules.
      const fmt = _tzFmtCache.get('bj|gate') || new Intl.DateTimeFormat('en-GB', { timeZone: 'Asia/Shanghai', hour12: false, weekday: 'short', hour: '2-digit', minute: '2-digit' });
      _tzFmtCache.set('bj|gate', fmt);
      const parts = fmt.formatToParts(new Date());
      const obj = {};
      for (const p of parts) if (p.type !== 'literal') obj[p.type] = p.value;
      const weekday = obj.weekday || '';
      const total = (+obj.hour % 24) * 60 + (+obj.minute);
      const isWeekday = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri'].includes(weekday);
      const inNight = total >= 21 * 60 || total < 8 * 60;
      return { available: isWeekday && inNight };
    }
    function fableServerState() {
      const fable = 'anthropic/claude-fable-5';
      const tokens = (proxyData && proxyData.token_state) || [];
      for (const token of tokens) {
        const detail = token.session_detail || {};
        const model = detail.requestedModel || detail.currentModel || token.model || token.locked_model;
        if (model !== fable) continue;
        if (detail.status === 'model_unavailable') {
          return { state: 'closed', label: detail.availableHours ? `服务端不可用 · ${detail.availableHours}` : '服务端不可用' };
        }
        if (detail.status === 'active') return { state: 'available', label: '服务端可用' };
      }
      return null;
    }
    function updateTimezones() {
      const bjEl = document.getElementById('tzBj');
      const ptEl = document.getElementById('tzPt');
      const etEl = document.getElementById('tzEt');
      const bjDateEl = document.getElementById('tzBjDate');
      const ptMetaEl = document.getElementById('tzPtMeta');
      const etMetaEl = document.getElementById('tzEtMeta');
      const fableEl = document.getElementById('tzFableStatus');
      if (bjEl) bjEl.textContent = fmtTzClock('Asia/Shanghai');
      if (ptEl) ptEl.textContent = fmtTzClock('America/Los_Angeles');
      if (etEl) etEl.textContent = fmtTzClock('America/New_York');
      if (bjDateEl) bjDateEl.textContent = fmtTzDate('Asia/Shanghai');
      if (ptMetaEl) {
        const r = ptResetCountdown();
        const soon = r.s < 3600;
        ptMetaEl.textContent = `距 quota 重置 ${r.h}h ${r.m}m`;
        ptMetaEl.className = 'tz-meta' + (soon ? ' reset-soon' : '');
      }
      if (etMetaEl) etMetaEl.textContent = fmtTzDate('America/New_York');
      if (fableEl) {
        const server = fableServerState();
        if (server) {
          fableEl.className = `tz-badge ${server.state === 'available' ? 'available' : 'unavailable'}`;
          fableEl.textContent = server.label;
          fableEl.title = '来自 /healthz 的服务端 session_detail';
        } else {
          const estimate = fableAvailability();
          fableEl.className = `tz-badge ${estimate.available ? 'available' : 'unavailable'}`;
          fableEl.textContent = `本地估算：${estimate.available ? '可用' : '不可用'}`;
          fableEl.title = '本地北京时间估算，仅供参考，最终以服务端状态为准';
        }
      }
    }

    // Single 1s tick for all per-second UI (session countdown, timezone
    // clocks, quota reset countdown). Paused while the tab is hidden so a
    // background tab burns no CPU.
    function oneSecondTick() {
      if (document.hidden) return;
      updateRemainingDisplay();
      updateTimezones();
      updateQuotaResetCountdown();
    }

    document.addEventListener('DOMContentLoaded', () => {
      try { const cached = localStorage.getItem('adsEnabled'); if (cached === 'false') { adsEnabled = false; const t = document.getElementById('adsToggleEnv'); if (t) t.checked = false; } } catch (e) {}
      loadConfiguration().then(() => { if (adsEnabled) fetchAds().then(renderAdInTokenCard); else renderAdInTokenCard(); });
      checkHealth();
      updateTimezones();
      setInterval(() => checkHealth(true), 5000);
      setInterval(() => rotateAd(), 30000);
      setInterval(oneSecondTick, 1000);
    });
  </script>
